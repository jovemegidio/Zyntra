<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Zyntra: RH + eSocial</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="/js/auth-unified.js?v=20260301" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="/css/global-header-sidebar.css?v=20260615b">
    <style>
        body { margin:0; font-family:'Inter',system-ui,sans-serif; background:#f1f3f9; color:#1f2433; }
        .es-wrap { max-width:1100px; margin:0 auto; padding:24px; }
        .es-title { font-size:20px; font-weight:800; margin:0 0 18px; display:flex; align-items:center; gap:10px; }
        .kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; margin-bottom:22px; }
        .kpi { background:#fff; border:1px solid #e6e8f0; border-radius:14px; padding:16px; }
        .kpi .label { font-size:11px; color:#6b7280; font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
        .kpi .value { font-size:22px; font-weight:800; margin-top:6px; }
        .es-card { background:#fff; border:1px solid #e6e8f0; border-radius:14px; padding:18px; margin-bottom:20px; }
        .es-card h3 { margin:0 0 14px; font-size:15px; font-weight:700; }
        .es-form { display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:12px; align-items:end; }
        label { display:block; font-size:12px; color:#6b7280; font-weight:600; margin-bottom:5px; }
        input,select { width:100%; box-sizing:border-box; padding:9px 11px; border:1px solid #d8dce8; border-radius:8px; font-size:13px; }
        .btn { border:none; cursor:pointer; border-radius:8px; padding:10px 16px; font-size:13px; font-weight:600; }
        .btn-primary{background:#ec4899;color:#fff;} .btn-primary:hover{background:#db2777;}
        .btn-mini{background:#eef0f7;color:#4b5563;padding:5px 10px;font-size:12px;border-radius:6px;border:none;cursor:pointer;}
        table.es-tbl { width:100%; border-collapse:collapse; font-size:13px; }
        table.es-tbl th { text-align:left; color:#6b7280; font-weight:600; font-size:12px; padding:9px 10px; }
        table.es-tbl td { padding:10px; border-top:1px solid #eef0f6; }
        .pill { font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; }
        .pill.pendente{background:#fef3c7;color:#b45309;} .pill.enviado{background:#dcfce7;color:#15803d;}
        .pill.erro,.pill.rejeitado{background:#fee2e2;color:#b91c1c;} .pill.processando{background:#e0e7ff;color:#4338ca;}
        .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:#111827; color:#fff; padding:12px 18px; border-radius:10px; font-size:13px; opacity:0; transition:.25s; z-index:9999; }
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0);} .toast.ok{background:#15803d;} .toast.err{background:#b91c1c;}
        @media(max-width:760px){ .es-form{grid-template-columns:1fr;} }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMobileSidebar()"></div>
        <aside class="sidebar" id="mobile-sidebar"></aside>
        <main class="main-area">
            <header class="header">
                <div class="header-left">
                    <button class="mobile-menu-btn" onclick="toggleMobileSidebar()"><i class="fas fa-bars"></i></button>
                    <div class="header-brand" style="display:flex;align-items:center;gap:10px;">
                        <img src="/images/zyntra-sem-fundo.png" alt="Zyntra" style="height:22px;">
                        <span style="color:rgba(255,255,255,.18);">—</span>
                        <span style="font-size:13px;color:rgba(255,255,255,.85);">RH + eSocial</span>
                    </div>
                </div>
                <div class="header-right"><a class="header-btn" href="/dashboard"><i class="fas fa-arrow-left"></i></a></div>
            </header>
            <div class="es-wrap">
                <h1 class="es-title"><i class="fas fa-file-export" style="color:#ec4899"></i> RH Completo + eSocial</h1>
                <div class="kpi-grid" id="kpis"></div>

                <div class="es-card">
                    <h3>Novo evento eSocial</h3>
                    <div class="es-form">
                        <div><label>Tipo de evento</label><select id="tipo"></select></div>
                        <div><label>Competência</label><input id="competencia" type="month"></div>
                        <div><label>Funcionário (ID)</label><input id="funcionario_id" type="number" placeholder="opcional"></div>
                        <div><button class="btn btn-primary" onclick="criar()"><i class="fas fa-plus"></i> Criar</button></div>
                    </div>
                </div>

                <div class="es-card">
                    <h3>Eventos <button class="btn-mini" style="float:right" onclick="loadEventos()"><i class="fas fa-sync-alt"></i> Atualizar</button></h3>
                    <table class="es-tbl"><thead><tr><th>Evento</th><th>Funcionário</th><th>Competência</th><th>Status</th><th>Criado</th><th>Ações</th></tr></thead>
                        <tbody id="eventos-body"><tr><td colspan="6" style="color:#9ca3af">Carregando…</td></tr></tbody></table>
                </div>
            </div>
        </main>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        function toggleMobileSidebar(){var s=document.getElementById('mobile-sidebar'),o=document.getElementById('sidebar-overlay');if(s)s.classList.toggle('open');if(o)o.classList.toggle('active');}
        function basePath(){var b=window.__MOUNT_PATH__||'';if(!b){var m=(location.pathname||'').match(/^\/labor-(energy|eletric)(?=\/|$)/i);b=m?m[0]:'';}return b&&b!=='/'?b.replace(/\/+$/,''):'';}
        var API=basePath()+'/api/esocial';
        function authH(e){e=e||{};try{var t=localStorage.getItem('authToken')||localStorage.getItem('token')||sessionStorage.getItem('tabAuthToken');if(t)e['Authorization']='Bearer '+t;}catch(x){}return e;}
        function api(path,opts){opts=opts||{};opts.credentials='include';opts.headers=authH(opts.headers||{});if(opts.body&&typeof opts.body!=='string'){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body);}return fetch(API+path,opts).then(function(r){return r.json().catch(function(){return{};});});}
        function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
        function dataBR(s){if(!s)return '—';var d=new Date(s);return isNaN(d)?'—':d.toLocaleDateString('pt-BR');}
        var toastT; function toast(m,k){var e=document.getElementById('toast');e.textContent=m;e.className='toast show '+(k||'');clearTimeout(toastT);toastT=setTimeout(function(){e.className='toast '+(k||'');},3600);}

        function loadStatus(){
            api('/status').then(function(res){
                var d=(res&&res.data)||{};
                document.getElementById('kpis').innerHTML=
                    '<div class="kpi"><div class="label">Pendentes</div><div class="value">'+(d.eventos_pendentes||0)+'</div></div>'+
                    '<div class="kpi"><div class="label">Enviados no mês</div><div class="value">'+(d.eventos_enviados_mes||0)+'</div></div>'+
                    '<div class="kpi"><div class="label">Leiaute</div><div class="value">'+esc(d.versao_leiaute||'S-1.2')+'</div></div>'+
                    '<div class="kpi"><div class="label">Certificado</div><div class="value" style="font-size:16px;color:'+(d.certificado_valido?'#16a34a':'#dc2626')+'">'+(d.certificado_valido?'Válido':'Inválido')+'</div></div>';
            });
        }
        function loadTipos(){
            api('/tipos-eventos').then(function(res){
                var tipos=(res&&res.data)||[]; var grupos={};
                tipos.forEach(function(t){(grupos[t.grupo]=grupos[t.grupo]||[]).push(t);});
                var html=''; Object.keys(grupos).forEach(function(g){
                    html+='<optgroup label="'+esc(g)+'">'+grupos[g].map(function(t){return '<option value="'+t.codigo+'">'+t.codigo+' — '+esc(t.nome)+'</option>';}).join('')+'</optgroup>';
                });
                document.getElementById('tipo').innerHTML=html;
            });
        }
        function loadEventos(){
            api('/eventos?limite=100').then(function(res){
                var rows=(res&&res.data)||[];
                document.getElementById('eventos-body').innerHTML=rows.length?rows.map(function(e){
                    var st=(e.status||'pendente').toLowerCase();
                    return '<tr><td><strong>'+esc(e.tipo_evento)+'</strong></td><td>'+esc(e.funcionario_nome||'—')+'</td>'+
                        '<td>'+esc(e.competencia||'—')+'</td><td><span class="pill '+st+'">'+esc(e.status||'pendente')+'</span></td>'+
                        '<td>'+dataBR(e.created_at)+'</td>'+
                        '<td><button class="btn-mini" onclick="gerar('+e.id+',\''+esc(e.tipo_evento)+'\')">Gerar XML</button> '+
                        (st==='pendente'?'<button class="btn-mini" onclick="enviar('+e.id+')">Enviar</button>':'')+'</td></tr>';
                }).join(''):'<tr><td colspan="6" style="color:#9ca3af">Nenhum evento ainda.</td></tr>';
            });
        }
        function criar(){
            var tipo=document.getElementById('tipo').value;
            var comp=document.getElementById('competencia').value;
            var func=document.getElementById('funcionario_id').value;
            if(!tipo){toast('Selecione o tipo de evento.','err');return;}
            api('/eventos',{method:'POST',body:{tipo_evento:tipo,competencia:comp||undefined,funcionario_id:func||undefined}}).then(function(r){
                toast(r.message||r.error||'',r.success?'ok':'err'); if(r.success){loadEventos();loadStatus();}
            });
        }
        function gerar(id,tipo){
            api('/gerar-evento',{method:'POST',body:{evento_id:id,tipo_evento:tipo}}).then(function(r){
                if(r.success&&r.data&&r.data.xml){
                    var w=window.open('','_blank'); w.document.write('<pre style="white-space:pre-wrap;font-size:12px;padding:16px">'+esc(r.data.xml)+'</pre>'); w.document.title='eSocial '+tipo;
                    toast('XML gerado.','ok');
                } else toast(r.error||'Falha ao gerar XML.','err');
            });
        }
        function enviar(id){
            if(!confirm('Transmitir este evento ao eSocial?'))return;
            api('/enviar/'+id,{method:'POST',body:{}}).then(function(r){toast(r.message||r.error||'',r.success?'ok':'err');if(r.success){loadEventos();loadStatus();}});
        }

        document.addEventListener('DOMContentLoaded',function(){
            function go(){loadStatus();loadTipos();loadEventos();}
            if(window.ZyntraEntitlements){window.ZyntraEntitlements.guard('rh-esocial').then(function(ok){if(ok)go();});}
            else go();
        });
    </script>
    <script src="/js/store-entitlements.js?v=20260614"></script>
    <script src="/js/global-sidebar-submenu.js?v=20260703imp" defer></script>
</body>
</html>
